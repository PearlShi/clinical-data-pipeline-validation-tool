# ============================================================================
# 变量映射规则配置文件
# ============================================================================
# 定义原始数据变量到 SDTM 标准变量的映射规则
# 支持精确匹配、模糊匹配与自定义转换函数

# =====================
# 全局映射配置
# =====================
mapping:
  # 标准字段直接映射（原始变量名 → SDTM 变量名）
  direct_mappings:
    STUDYID: "STUDYID"            # 研究编号（保持不变）
    USUBJID: "USUBJID"            # 受试者唯一标识（保持不变）
    DOMAIN: "DOMAIN"              # 数据域（保持不变）
    SUBJID: "SUBJID"              # 受试者编号
    SITEID: "SITEID"              # 研究中心编号
    AGE: "AGE"                    # 年龄
    AGEU: "AGEU"                  # 年龄单位
    SEX: "SEX"                    # 性别
    RACE: "RACE"                  # 种族
    ETHNIC: "ETHNIC"              # 民族
    ARM: "ARM"                    # 分组
    ARMCD: "ARMCD"                # 分组编码
    COUNTRY: "COUNTRY"            # 国家
    WEIGHT: "WEIGHT"              # 体重
    HEIGHT: "HEIGHT"              # 身高
    BMI: "BMI"                    # 身体质量指数
    AETERM: "AETERM"              # 不良事件术语
    AEDECOD: "AEDECOD"            # 不良事件编码术语
    AEBODSYS: "AEBODSYS"          # 不良事件系统器官分类
    AESEV: "AESEV"                # 严重程度
    AESER: "AESER"                # 是否严重
    AEREL: "AEREL"                # 相关性
    AEOUT: "AEOUT"                # 结局
    LB_ORRES: "LB_ORRES"          # 实验室检查原始结果
    LB_ORRESU: "LB_ORRESU"        # 原始结果单位
    LB_ORNOR: "LB_ORNOR"          # 正常范围
    LB_ORNRLO: "LB_ORNRLO"        # 正常范围下限
    LB_ORNRHI: "LB_ORNRHI"        # 正常范围上限
    VS_ORRES: "VS_ORRES"          # 生命体征原始结果
    VS_ORRESU: "VS_ORRESU"        # 生命体征结果单位
    EXDOSE: "EXDOSE"              # 给药剂量
    EXDOSU: "EXDOSU"              # 剂量单位
    EXROUTE: "EXROUTE"            # 给药途径
    EXFREQ: "EXFREQ"              # 给药频率
    MHTERM: "MHTERM"              # 病史术语
    MHBODSYS: "MHBODSYS"          # 病史系统器官分类
    CMDECOD: "CMDECOD"            # 合并用药编码术语
    CMDOSE: "CMDOSE"              # 合并用药剂量
    CMROUTE: "CMROUTE"            # 合并用药途径
    CMFREQ: "CMFREQ"              # 合并用药频率

  # 时间变量映射（自动添加 DTC 后缀）
  date_mappings:
    RFSTDTC: "RFSTDTC"            # 首次给药/研究日期
    RFENDTC: "RFENDTC"            # 末次给药/研究日期
    AESTDTC: "AESTDTC"            # 不良事件开始日期
    AEENDTC: "AEENDTC"            # 不良事件结束日期
    LB_DTC: "LB_DTC"              # 实验室检查日期
    VS_DTC: "VS_DTC"              # 生命体征测量日期
    EX_DTC: "EX_DTC"              # 给药日期
    MH_STDTC: "MH_STDTC"          # 病史开始日期
    CM_STDTC: "CM_STDTC"          # 合并用药开始日期

# =====================
# 分类变量值映射
# =====================
value_mappings:
  SEX:
    "男": "M"
    "女": "F"
    "Male": "M"
    "Female": "F"
    "M": "M"
    "F": "F"
  ARM:
    "安慰剂": "PLACEBO"
    "治疗组10mg": "TREATMENT_10MG"
    "治疗组20mg": "TREATMENT_20MG"
    "阳性对照": "ACTIVE_COMPARATOR"
  AESEV:
    "轻度": "MILD"
    "中度": "MODERATE"
    "重度": "SEVERE"
    "死亡": "DEATH"
  AESER:
    "是": "Y"
    "否": "N"
    "Yes": "Y"
    "No": "N"
    "Y": "Y"
    "N": "N"
  AEREL:
    "无关": "NOT RELATED"
    "可能有关": "POSSIBLE"
    "很可能有关": "PROBABLE"
    "肯定有关": "DEFINITE"

# =====================
# DOMAIN 前缀配置
# =====================
domain_prefixes:
  AE: "AE"
  VS: "VS"
  LB: "LB"
  EX: "EX"
  MH: "MH"
  CM: "CM"
  DS: "DS"
  SC: "SC"

# =====================
# 变量默认值
# =====================
variable_defaults:
  STUDYID: "STUDY001"             # 默认研究编号（可在转换时覆盖）
  DOMAIN: "DM"                    # 默认数据域
  AGEU: "YEARS"                   # 年龄单位
  VISIT: "SCREENING"              # 默认访视名称
  VISITNUM: 1                     # 默认访视编号
  EPOCH: "SCREENING"              # 默认试验阶段
  DOSEREGIMEN: ""                 # 默认给药方案
  ARMCD: "NOT_ASSIGNED"           # 默认分组编码
  COUNTRY: "CHN"                  # 默认国家
